<style>
:root{

  --ink:#EEF3FA; --ink-2:#9AA8BD; --ink-3:#5E6C82; --ink-4:#3F4B5E;
  --bull:#19E58C; --bull-hi:#7CFFC4; --bull-hot:#C9FFE9; --bull-deep:#0E7A49; --bull-dark:#06120D; --bull-mute:#1E9E6E; --bull-glow:rgba(25,229,140,.35);
  --bear:#FF3B5C; --bear-hi:#FF9AA8; --bear-hot:#FFD3DC; --bear-deep:#A3172E; --bear-dark:#14060A; --bear-mute:#C23A52; --bear-glow:rgba(255,59,92,.35);
  --spine:#E8F1FF; --nifty:#F4F7FB; --wall:#2F6BFF; --wall-base:#0E1D3D; --vwap:#6FA3FF; --neutral-lane:#3A4658;
  --amber:#FFB020; --crash:#FF6A4D; --slate-candle:#4A5468;
  --f-ui:'Inter Tight',-apple-system,'SF Pro Display','Segoe UI',Roboto,sans-serif;
  --f-num:'JetBrains Mono','SF Mono',Menlo,Consolas,monospace;
  --f-tk:'Barlow Condensed','Arial Narrow','Roboto Condensed',sans-serif-condensed,sans-serif;
  --tx:1; --ease:cubic-bezier(.16,1,.3,1);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:var(--f-ui);-webkit-font-smoothing:antialiased;overflow:hidden}
body.stacked{overflow-x:hidden;overflow-y:auto;height:auto;min-height:100%}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}
#atmo{position:fixed;inset:0;pointer-events:none;
  background:
    radial-gradient(60vw 60vh at 85% 50%, rgba(70,110,200,.06), transparent 70%),
    radial-gradient(40vw 30vh at 85% 25%, rgba(25,229,140,.05), transparent 70%),
    radial-gradient(40vw 30vh at 85% 75%, rgba(255,59,92,.05), transparent 70%),
    var(--bg)}
/* #grain removed for GPU performance */

/* ---------- stage ---------- */
#stage{position:absolute;left:0;top:0;width:1920px;height:1080px;transform-origin:0 0;overflow:hidden;contain:layout paint;will-change:transform}
body.stacked #stage{display:none}
#stage .L{position:absolute;inset:0;pointer-events:none}
#lyBase{background:var(--bg)}
#lyLight{inset:-24px!important;background:radial-gradient(1100px 800px at 1654px 50%, rgba(70,110,200,.075), transparent 70%)}
#lyHalves{background:
  radial-gradient(520px 360px at 1630px 26%, rgba(25,229,140,.09), transparent),
  radial-gradient(520px 360px at 1630px 74%, rgba(255,59,92,.09), transparent)}
#lyVig{background:linear-gradient(90deg, rgba(0,0,0,.35), transparent 35%)}
#topRail{position:absolute;left:16px;right:16px;top:4px;height:1px;background:linear-gradient(90deg, rgba(232,241,255,.05), rgba(232,241,255,.22) 72%, rgba(232,241,255,.10))}
canvas.cv{position:absolute;display:block;pointer-events:none}

/* ---------- crest ---------- */
#crest{position:absolute;left:0;top:0;width:700px;height:96px;--tx:var(--txc,1)}
#crest .blk{position:absolute}
.cap{font-family:var(--f-ui);font-weight:600;font-size:calc(8.5px*var(--tx));letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3);white-space:nowrap}
.brand{left:24px;top:20px;width:156px;cursor:default;user-select:none}
.brand .logo{position:absolute;left:0;top:2px;width:28px;height:28px}
.brand .logo i{position:absolute;left:0;height:4px;border-radius:1px}
.brand .wm{position:absolute;left:36px;top:0;font-weight:800;font-size:calc(20px*var(--tx));letter-spacing:.02em;color:var(--ink);line-height:1}
.brand .sub{position:absolute;left:36px;top:calc(21px*var(--tx));letter-spacing:.28em}
.brand .date{position:absolute;left:0;top:44px;font-size:calc(9px*var(--tx));letter-spacing:.12em}
.nifty{left:188px;top:20px;width:152px}
.nifty .lvl{font-family:var(--f-num);font-variant-numeric:tabular-nums;font-weight:600;font-size:calc(26px*var(--tx));line-height:1;margin-top:4px;color:var(--ink);letter-spacing:-.02em;white-space:nowrap}
.nifty .chg{font-family:var(--f-num);font-variant-numeric:tabular-nums;font-size:calc(12px*var(--tx));color:var(--bear);margin-top:4px;white-space:nowrap}
.nifty canvas{position:absolute;left:0;top:64px}
.cap.l2{color:var(--ink-2)}
.igrid{left:346px;top:22px;width:208px;height:65px;display:grid;grid-template-columns:62px 62px 74px;grid-auto-rows:30px;gap:5px}
.igrid .ic{border-radius:3px;background:rgba(15,22,34,.55);padding:3px 5px 0;overflow:hidden}
.igrid .ic .cap{font-size:calc(8.5px*var(--tx));color:var(--ink-2);letter-spacing:.06em}
.igrid .ic .v{font-family:var(--f-num);font-variant-numeric:tabular-nums;font-size:calc(12px*var(--tx));line-height:1.15;white-space:nowrap}
.igrid .ic.vix{padding:3px 3px 0 5px}.igrid .ic.vix .v{color:var(--amber);font-size:calc(11px*var(--tx));letter-spacing:-.04em}
.clock{left:550px;top:20px;width:80px;text-align:center}
.clock .t{font-family:var(--f-num);font-variant-numeric:tabular-nums;font-size:calc(13px*var(--tx));color:var(--ink);letter-spacing:.02em;font-weight:500}
.clock .st{margin-top:3px;display:flex;align-items:center;justify-content:center;gap:5px}
.clock .eng{width:5px;height:5px;border-radius:50%;background:var(--vwap);box-shadow:0 0 6px var(--vwap);animation:eng 1.6s ease-in-out infinite}
@keyframes eng{0%,100%{opacity:.35}50%{opacity:1}}
.clock .notch{position:absolute;left:36px;top:52px;width:8px;height:6px;border-left:4px solid transparent;border-right:4px solid transparent;border-top:6px solid rgba(232,241,255,.7);box-sizing:border-box;width:0;height:0;margin-left:0}
.breadth{left:632px;top:18px;width:58px;text-align:right}
.breadth .n{font-family:var(--f-num);font-variant-numeric:tabular-nums;font-weight:600;font-size:calc(22px*var(--tx));line-height:1.02}
.breadth .n.b{color:var(--bull);text-shadow:0 0 14px rgba(25,229,140,.35)} .breadth .n.r{color:var(--bear);text-shadow:0 0 14px rgba(255,59,92,.35)}
.breadth .bar{position:relative;height:4px;margin-top:5px;display:flex;border-radius:2px;overflow:hidden}
.breadth .bar i{display:block;height:100%}
/* ---------- market pulse: every stock as a dot at its % move (bullish above the line, bearish below) ---------- */
#crest .pulse{pointer-events:auto;cursor:crosshair}
.pulse .pcv{position:absolute;left:0;top:0}
.pulse .pz{position:absolute;width:6px;height:6px;margin:-3px 0 0 -3px;border-radius:50%;background:#fff;pointer-events:none;
  box-shadow:0 0 8px 2px rgba(232,241,255,.8),0 0 18px 4px rgba(120,150,255,.45);animation:pzb 2.8s ease-in-out infinite}
.pulse .pz::after{content:"";position:absolute;left:50%;top:50%;width:6px;height:6px;border-radius:50%;border:1px solid rgba(232,241,255,.6);
  transform:translate(-50%,-50%);animation:pzr 3.2s cubic-bezier(.16,1,.3,1) infinite}
@keyframes pzb{0%,100%{transform:scale(.8);opacity:.75}50%{transform:scale(1.25);opacity:1}}
@keyframes pzr{0%{width:6px;height:6px;opacity:.9}60%,100%{width:30px;height:30px;opacity:0}}
/* the two market callouts: the lagging sector (left) and the leading sector (right), each tied to its average on the scale */
.pulse .ptag{position:absolute;display:flex;align-items:center;gap:5px;white-space:nowrap;line-height:1;font-family:var(--f-ui);transition:opacity .3s var(--ease)}
.pulse .ptag svg{width:12px;height:12px;flex:none;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.pulse .ptag.dn svg{color:var(--bear)} .pulse .ptag.up svg{color:var(--bull)}
.pulse .ptag .k{font-weight:600;font-size:calc(8px*var(--tx));letter-spacing:.14em;color:var(--ink-3)}
.pulse .ptag b{font-family:var(--f-tk);font-weight:700;font-size:calc(12px*var(--tx));letter-spacing:.03em;color:var(--ink)}
.pulse .ptag .v{font-family:var(--f-num);font-variant-numeric:tabular-nums;font-weight:600;font-size:calc(10px*var(--tx))}
.pulse .ptag.dn .v{color:var(--bear-hi)} .pulse .ptag.up .v{color:var(--bull-hi)}
.pulse.tight .ptag .k{display:none}
/* the counts, labelled, top-aligned with the callouts */
.pulse .pcount{position:absolute;right:0;top:2px;display:flex;flex-direction:column;align-items:flex-end;gap:6px;pointer-events:none}
.pulse .pcount .pc{display:flex;flex-direction:column;align-items:flex-end;gap:3px}
.pulse .pcount .k{display:flex;align-items:center;gap:4px;font-family:var(--f-ui);font-weight:600;font-size:calc(8px*var(--tx));letter-spacing:.14em;color:var(--ink-3);line-height:1}
.pulse .pcount svg{width:8px;height:8px;flex:none;fill:currentColor}
.pulse .pcount .b svg{color:var(--bull)} .pulse .pcount .r svg{color:var(--bear)}
.pulse .pcount b{font-family:var(--f-num);font-variant-numeric:tabular-nums;font-weight:600;font-size:calc(20px*var(--tx));line-height:1}
.pulse .pcount .b b{color:var(--bull);text-shadow:0 0 14px rgba(25,229,140,.35)}
.pulse .pcount .r b{color:var(--bear);text-shadow:0 0 14px rgba(255,59,92,.35)}

/* ---------- plume DOM ---------- */
#chips .chip{position:absolute;width:128px;height:24px;border-radius:4px;border:1px solid var(--hair);background:rgba(4,6,10,.85);opacity:.6;padding:3px 6px 0;transition:opacity .14s;cursor:default;pointer-events:auto;
  -webkit-mask-image:linear-gradient(90deg,#000 85%,rgba(0,0,0,.55));mask-image:linear-gradient(90deg,#000 85%,rgba(0,0,0,.55))}
#chips .chip:hover,#chips .chip.hot{opacity:1}
#chips .chip .r1{display:flex;justify-content:space-between;align-items:baseline;line-height:1}
#chips .chip .r1 .cap{font-size:calc(8.5px*var(--tx));color:var(--ink-2);letter-spacing:.1em}
#chips .chip .r1 .v{font-family:var(--f-num);font-variant-numeric:tabular-nums;font-size:calc(9.5px*var(--tx))}
#chips .chip .strip{position:absolute;left:6px;right:6px;bottom:3px;height:6px;display:flex;gap:1px}
#chips .chip .strip i{flex:1 1 0;height:100%;border-radius:1px}
#idxTags .tag{position:absolute;height:18px;border-radius:3px;padding:0 6px 0 7px;display:flex;align-items:center;gap:6px;font-family:var(--f-num);font-variant-numeric:tabular-nums;font-size:calc(9.5px*var(--tx));white-space:nowrap;pointer-events:auto;cursor:default;
  background:rgba(8,12,18,.86);color:var(--ink-2);border:1px solid rgba(154,168,189,.18)}
#idxTags .tag::after{content:"";position:absolute;right:-6px;top:50%;margin-top:-5px;border-left:5px solid rgba(154,168,189,.35);border-top:5px solid transparent;border-bottom:5px solid transparent}
#idxTags .tag.nf{background:var(--nifty);color:#04060A;font-weight:700;border-color:var(--nifty);box-shadow:0 0 14px rgba(244,247,251,.25)}
#idxTags .tag.nf::after{border-left-color:var(--nifty)}
#idxTags .tag .k{font-family:var(--f-ui);font-weight:700;font-size:calc(8.5px*var(--tx));letter-spacing:.08em}
#idxTags .lead{position:absolute;height:1px;background:rgba(154,168,189,.35)}

/* ---------- nodes / NOW ---------- */
#nodes{position:absolute;inset:0;pointer-events:none}
.nowline{position:absolute;width:1px;background:rgba(232,241,255,.7)}
.nowglow{position:absolute;width:56px;margin-left:-28px;background:linear-gradient(90deg,transparent,rgba(169,184,255,.16) 45%,rgba(232,241,255,.34) 50%,rgba(169,184,255,.16) 55%,transparent);animation:breathe 3s ease-in-out infinite}
@keyframes breathe{0%,100%{transform:scaleX(.6)}50%{transform:scaleX(1.05)}}
.node{position:absolute;border-radius:50%;background:#fff;transform:translate(-50%,-50%)}
.node.dia{border-radius:1px;transform:translate(-50%,-50%) rotate(45deg)}
.node .ring{position:absolute;left:50%;top:50%;border-radius:50%;border:1px solid rgba(232,241,255,.6);transform:translate(-50%,-50%)}
.beacon{box-shadow:0 0 14px 3px rgba(232,241,255,.75),0 0 30px rgba(120,150,255,.45)}
.beacon .ring{width:6px;height:6px;animation:ring 4s var(--ease) infinite}
@keyframes ring{0%{width:6px;height:6px;opacity:.9}35%{width:80px;height:80px;opacity:0}100%{width:80px;height:80px;opacity:0}}
.node.st{box-shadow:0 0 10px 2px rgba(169,184,255,.6)}
.node.flare{animation:flare .22s ease-out}
@keyframes flare{50%{transform:translate(-50%,-50%) scale(1.5)}}
.node.dia.flare{animation:flared .22s ease-out}
@keyframes flared{50%{transform:translate(-50%,-50%) rotate(45deg) scale(1.5)}}
.reactor{position:absolute;width:0;height:0}
.reactor .core{position:absolute;left:-8px;top:-8px;width:16px;height:16px;border-radius:50%;background:radial-gradient(circle,#fff 0 45%,#dfe8ff 60%,rgba(169,184,255,.0) 72%);box-shadow:0 0 18px 4px rgba(232,241,255,.55)}
.reactor .halo{position:absolute;left:-30px;top:-30px;width:60px;height:60px;border-radius:50%;background:radial-gradient(circle,rgba(169,184,255,.28),transparent 65%);animation:halo 3s ease-in-out infinite}
@keyframes halo{0%,100%{transform:scale(.8);opacity:.6}50%{transform:scale(1.15);opacity:1}}
.reactor svg{position:absolute;left:-20px;top:-20px;overflow:visible}
.reactor .r1{animation:spin 24s linear infinite;transform-origin:20px 20px}
.reactor .r2{animation:spin 36s linear infinite reverse;transform-origin:20px 20px}
@keyframes spin{to{transform:rotate(360deg)}}

/* ---------- tiles ---------- */
.tile{position:absolute;border-radius:6px;overflow:hidden;cursor:pointer;transition:opacity .14s, box-shadow .14s;
  background:linear-gradient(180deg,rgba(var(--sc),.07),transparent),rgba(10,15,23,.86);
  box-shadow:0 6px 14px rgba(0,0,0,.5), inset 0 0 0 1px rgba(255,255,255,.04)}
.tile.c4{border-radius:4px}
.tile .bd{position:absolute;inset:0;border-radius:inherit;border:1px solid rgba(var(--sc),var(--ba));pointer-events:none}
.tile.pk{box-shadow:0 6px 14px rgba(0,0,0,.5),0 0 18px rgba(var(--sc),.18), inset 0 0 0 1px rgba(255,255,255,.04)}
.tile.pk .bd{border-width:1.5px}
.tile canvas{position:absolute;left:0;top:0}
.tile .plate{position:absolute;left:3px;top:3px;background:rgba(5,7,11,.72);border-radius:2px;padding:2px 5px 3px 4px;display:flex;flex-direction:column;align-items:flex-start;gap:1px;max-width:calc(100% - 28px)}
.tile .tkr{display:inline-block;max-width:100%;font-family:var(--f-tk);font-weight:600;color:#F4F7FF;line-height:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:.01em}
.tile .pc{font-family:var(--f-num);font-variant-numeric:tabular-nums;line-height:1.05;white-space:nowrap;font-weight:600}
.tile .buc{font-family:var(--f-ui);font-weight:700;font-size:calc(7.5px*var(--tx));letter-spacing:.12em;padding:1px 4px;border-radius:2px;margin-top:2px;white-space:nowrap;align-self:flex-start}
.tile .rk{position:absolute;right:4px;top:4px;height:12px;min-width:18px;padding:0 3px;border-radius:6px;font-family:var(--f-num);font-weight:700;font-size:calc(9px*var(--tx));line-height:12px;text-align:center}
.tile .seccap{position:absolute;right:4px;top:19px;font-family:var(--f-ui);font-weight:700;font-size:calc(7.5px*var(--tx));letter-spacing:.1em;color:var(--ink-3);background:var(--raised);border:1px solid var(--hair);padding:0 4px;border-radius:2px;line-height:11px}
.tile .br{position:absolute;width:8px;height:8px;border-color:rgba(var(--sc),.85);border-style:solid;border-width:0;pointer-events:none}
.tile .br.tl{left:2px;top:2px;border-left-width:1.5px;border-top-width:1.5px}
.tile .br.tr{right:2px;top:2px;border-right-width:1.5px;border-top-width:1.5px}
.tile .br.bl{left:2px;bottom:2px;border-left-width:1.5px;border-bottom-width:1.5px}
.tile .br.brr{right:2px;bottom:2px;border-right-width:1.5px;border-bottom-width:1.5px}
.tile .mg{width:26px;height:26px;border-radius:6px;display:flex;align-items:center;justify-content:center;font-family:var(--f-tk);font-weight:700;font-size:13px;color:#fff;flex:none}
.mg{position:relative;overflow:hidden}
.mg>img.lg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;border-radius:inherit;pointer-events:none;user-select:none;-webkit-user-drag:none}
.tile .row1{display:flex;align-items:center;gap:6px}
.tile .pips{display:flex;gap:3px;margin-top:3px}
.pips i{width:4px;height:4px;border-radius:50%;border:1px solid rgba(var(--sc),.8);display:block}
.pips i.on{background:rgb(var(--sc));box-shadow:0 0 4px rgba(var(--sc),.8)}
.tile .latch{position:absolute;right:0;width:3px;top:18%;bottom:18%;background:rgb(var(--sc));box-shadow:0 0 10px rgba(var(--sc),.9);border-radius:2px 0 0 2px}
.tile .obpulse{position:absolute;right:0;pointer-events:none;background:rgba(var(--sc),1);animation:obp 2.4s ease-in-out infinite;opacity:.25}
@keyframes obp{0%,100%{opacity:.14}50%{opacity:.30}}
.ret{position:absolute;pointer-events:none;transition:transform .22s cubic-bezier(.2,1.5,.35,1),opacity .22s}
.ret i{position:absolute;width:12px;height:12px;border-color:#fff;border-style:solid;border-width:0;filter:drop-shadow(0 0 3px rgba(255,255,255,.8))}
.ret i:nth-child(1){left:0;top:0;border-left-width:2px;border-top-width:2px}
.ret i:nth-child(2){right:0;top:0;border-right-width:2px;border-top-width:2px}
.ret i:nth-child(3){left:0;bottom:0;border-left-width:2px;border-bottom-width:2px}
.ret i:nth-child(4){right:0;bottom:0;border-right-width:2px;border-bottom-width:2px}
.tile.ev{border-radius:6px}
.tile.ev .haz{position:absolute;inset:0;background:repeating-linear-gradient(135deg,rgba(255,176,32,.30) 0 1.5px,transparent 1.5px 5px)}
.tile.ev .evtxt{position:absolute;left:8px;top:0;bottom:0;display:flex;align-items:center;gap:8px;white-space:nowrap}
.tile.ev .evtxt b{font-family:var(--f-tk);font-weight:700;font-size:calc(15px*var(--tx));color:#F4F7FF;background:rgba(5,7,11,.72);padding:1px 5px;border-radius:2px}
.tile.ev .evtxt span{font-family:var(--f-num);font-weight:700;font-size:calc(12px*var(--tx));color:var(--crash);background:rgba(5,7,11,.72);padding:1px 5px;border-radius:2px}
.tile.ev .rk{color:var(--amber);background:rgba(255,176,32,.16)}
.tile.lit .bd{border-color:#fff!important;border-width:1px}
#stage.brush .ret,#stage.brush .tile:not(.lit),#stage.brush .ticket:not(.lit),#stage.brush .anom:not(.lit),#stage.brush .bridge:not(.lit){opacity:.3}
#stage.brush .cv.dimmable{opacity:.35}
#stage.brush #chips .chip:not(.hot){opacity:.25}
.cv.dimmable{transition:opacity .14s}
#cvSpine{transition:opacity .14s}
#stage.brush #cvSpine,#stage.brush .node,#stage.brush .reactor{opacity:.35}
#stage:not(.brush) #cvSpine{opacity:.5}
#stage .node{opacity:.6}
.reactor .core,.reactor svg{opacity:.6}

/* ---------- bridges ---------- */
.bridge{position:absolute;height:20px;transform-origin:0 50%;
  background:linear-gradient(90deg,rgba(var(--sc),.55),rgba(var(--sc),.25));
  border-top:1px solid rgba(var(--sc),.8);border-bottom:1px solid rgba(var(--sc),.8);
  box-shadow:0 0 12px rgba(var(--sc),.45)}
.bridge.lit{box-shadow:0 0 16px rgba(255,255,255,.5);background:linear-gradient(90deg,rgba(var(--sc),.85),rgba(var(--sc),.45))}

/* ---------- tickets ---------- */
.ticket{position:absolute;border-radius:10px;cursor:pointer;
  background:var(--tbg);/* backdrop-filter removed for crisp rendering */
  box-shadow:0 22px 44px rgba(0,0,0,.6),0 0 36px rgba(var(--sc),.22),inset 0 1px 0 rgba(255,255,255,.06);
  transition:opacity .14s}
.ticket.buy{--tbg:radial-gradient(460px 200px at 16% 0%,rgba(25,229,140,.20),transparent 70%),linear-gradient(135deg,rgba(28,86,62,.95),rgba(15,30,36,.95) 70%)}
.ticket.sell{--tbg:radial-gradient(460px 200px at 16% 100%,rgba(255,59,92,.20),transparent 70%),linear-gradient(135deg,rgba(96,26,42,.95),rgba(18,24,34,.95) 70%)}
.ticket .gb{position:absolute;inset:0;border-radius:10px;padding:1px;pointer-events:none;

.chip2{position:absolute;right:1px;height:16px;border-radius:8px;padding:0 6px;font-family:var(--f-num);font-variant-numeric:tabular-nums;font-weight:700;font-size:calc(9.5px*var(--tx));line-height:16px;white-space:nowrap;letter-spacing:-.02em}

.lvlstrip{position:absolute;display:flex;justify-content:space-between;align-items:baseline;white-space:nowrap}

.ticket.lit{outline:1px solid rgba(255,255,255,.7);outline-offset:1px}

/* ---------- footer / inspector ---------- */
/* #footer removed */
.plan.wrap .cells{flex-wrap:wrap;row-gap:8px;column-gap:16px;justify-content:flex-start}

#stage.amb #cvWalls{animation:wallsh 5.3s ease-in-out infinite}
@keyframes wallsh{0%,100%{opacity:1}50%{opacity:.82}}

#stage.t3off #chips .chip{height:18px}

#stack .sheet{position:fixed;left:0;right:0;bottom:0;max-width:760px;max-height:72vh;overflow:hidden;margin:0 auto;z-index:60;background:linear-gradient(180deg,rgba(var(--sc,154,168,189),.08),rgba(var(--sc,154,168,189),0) 38%),#080C12;border:1px solid #243044;border-bottom:0;border-radius:14px 14px 0 0;padding:8px 16px calc(18px + env(safe-area-inset-bottom,0px));font-size:11px;color:var(--ink-2);

#stack .tile.lit .bd{border-color:#fff!important}
#stack .ticket.lit{outline:1px solid rgba(255,255,255,.7);outline-offset:1px}

/* ---------- replay head (plume replay 09:15 -> NOW) ---------- */
#scanHead{position:absolute;width:2px;margin-left:-1px;pointer-events:none;opacity:0;will-change:transform,opacity;z-index:1;
  background:linear-gradient(180deg,transparent,rgba(232,241,255,.55) 12%,rgba(232,241,255,.7) 50%,rgba(232,241,255,.55) 88%,transparent);
  box-shadow:0 0 10px rgba(169,184,255,.55),0 0 2px rgba(255,255,255,.6)}
#scanHead::before{content:"";position:absolute;top:0;bottom:0;right:1px;width:64px;
  background:linear-gradient(90deg,transparent,rgba(169,184,255,.07));-webkit-mask:linear-gradient(180deg,transparent,#000 12%,#000 88%,transparent);mask:linear-gradient(180deg,transparent,#000 12%,#000 88%,transparent)}
/* ---------- station count badges pop as the build reaches their node ---------- */

.cnt.cntpop{animation:cntpop .46s cubic-bezier(.2,1.5,.35,1) both}
@keyframes cntpop{0%{opacity:0;scale:.35}55%{opacity:1;scale:1.22}100%{opacity:1;scale:1}}

/* inspector: sparkline rides top-right on the ticker line; rank + conviction share a row */
#inspector canvas.spk{position:absolute;right:calc(12px*var(--tx));top:calc(11px*var(--tx));margin:0}
.ichart{position:relative;overflow:hidden;border-radius:6px;background:linear-gradient(180deg,rgba(3,6,10,.16),rgba(3,6,10,.08));box-shadow:inset 0 0 0 1px rgba(255,255,255,.065)}
#inspector.wide{width:calc(400px*var(--tx))}
#inspector .ichart{margin-top:calc(8px*var(--tx))} #stack .sheet .ichart{margin-top:8px}
#inspector .ichart canvas,#stack .sheet .ichart canvas{margin:0}
.ichart .chip2{display:flex;align-items:center;justify-content:space-between;padding:0 5px;border-radius:3px;border:1px solid transparent;font-weight:700;letter-spacing:-.02em;box-sizing:border-box}
.ichart .chip2 b{display:block;font-family:var(--f-ui);font-weight:800;letter-spacing:.05em;opacity:1;margin:0;text-align:left;flex:none;line-height:inherit}
.ichart .chip2 span{flex:none}
.ichart .chip2.k-T2{background:linear-gradient(rgba(var(--sc),.24),rgba(var(--sc),.24)),#0A0E14;border-color:rgba(var(--sc),.95);color:rgb(var(--hot));box-shadow:0 0 10px rgba(var(--sc),.28)}
.ichart .chip2.k-T1{background:linear-gradient(rgba(var(--sc),.10),rgba(var(--sc),.10)),#0A0E14;border:1px dashed rgba(var(--sc),.7);color:rgb(var(--hi))}
.ichart .chip2.k-E{background:linear-gradient(rgba(255,255,255,.14),rgba(255,255,255,.14)),#0A0E14;border-color:rgba(255,255,255,.8);color:#FFFFFF;box-shadow:0 0 8px rgba(255,255,255,.14)}
.ichart .chip2.k-SL{background:linear-gradient(rgba(255,176,32,.2),rgba(255,176,32,.2)),#0A0E14;border-color:rgba(255,176,32,.92);color:#FFC65C}
.chart .mlab{white-space:nowrap;font-family:var(--f-num);font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-.02em;
  text-shadow:0 0 1px var(--panel),0 0 2px var(--panel),0 0 3px var(--panel),0 0 4px var(--panel)}

.chart .mlab.k-T2{color:rgb(var(--sc))} .chart .mlab.k-T1{color:rgb(var(--hi))} .chart .mlab.k-E{color:var(--ink)} .chart .mlab.k-SL{color:var(--amber)} .chart .mlab.k-M{color:var(--amber);opacity:.8}

#inspector .h .t{padding-right:calc(100px*var(--tx))}

#stack .sheet .row>span>.k{margin-right:3px}
#stack .staxis{padding-left:4px}

/* ---- style-1-terrain.css ---- */
/* ===== S1 TERRAIN overrides (crest, sector chips, index heads, station counts, gate motes) =====
   Appended after style.css. Everything here is scoped to zone A/B/lens + the spine nodes. */

/* ---------- crest: max-content index grid, MIDCP, VIX never clips, left-aligned clock ---------- */
#crest .igrid{left:340px;top:22px;width:max-content;height:auto;--gs:1;
  grid-template-columns:repeat(3,max-content);grid-auto-rows:30px;gap:5px 4px}
#crest .igrid .ic{padding:3px 6px 0 6px;overflow:visible;min-width:0}
#crest .igrid .ic .cap{font-size:calc(8.5px*var(--tx)*var(--gs));letter-spacing:.06em}
#crest .igrid .ic .v{font-size:calc(12px*var(--tx)*var(--gs))}
#crest .igrid .ic.vix{min-width:max-content;padding:3px 6px 0 6px}
#crest .igrid .ic.vix .v{font-size:calc(11.5px*var(--tx)*var(--gs));letter-spacing:-.02em;white-space:nowrap}
#crest .igrid .ic.vix .vx{font-size:.8em;margin-left:.42em;letter-spacing:-.01em;opacity:.92}

#crest .clock{left:552px;top:49px;width:max-content;text-align:left;--cs:1}
#crest .clock .t{font-size:calc(13px*var(--tx)*var(--cs));line-height:1;letter-spacing:.02em}
#crest .clock .st{margin-top:5px;justify-content:flex-start;gap:5px}
#crest .clock .st .cap{font-size:calc(8.5px*var(--tx)*var(--cs));letter-spacing:.1em;line-height:1}
#crest .clock .eng{flex:none}

/* ---------- sector chips: explicit sign + %, values ≥70% alpha, glass scrim kept ---------- */
#chips .chip{opacity:1;background:rgba(4,6,10,.8);border-color:rgba(26,36,51,.9);
  box-shadow:0 0 0 2px rgba(4,6,10,.28),0 0 12px 3px rgba(4,6,10,.45)}
#chips .chip .r1{overflow:hidden}
#chips .chip .r1 .cap{color:rgba(154,168,189,.66);transition:color .14s}
#chips .chip .r1 .v{font-weight:500;letter-spacing:-.02em;white-space:nowrap;padding-left:4px;transition:color .14s}
#chips .chip.up .r1 .v{color:rgba(63,214,152,.88)}
#chips .chip.dn .r1 .v{color:rgba(236,104,128,.88)}
#chips .chip .strip{opacity:.58;transition:opacity .14s}
#chips .chip:hover .r1 .cap,#chips .chip.hot .r1 .cap{color:var(--ink-2)}
#chips .chip:hover .strip,#chips .chip.hot .strip{opacity:1}
#chips .chip:hover .r1 .v,#chips .chip.hot .r1 .v{filter:brightness(1.12)}
#stage.brush #chips .chip:not(.hot){opacity:.25}

/* ---------- index heads: taller hit box keeps up with --tx ---------- */
#idxTags .tag{height:calc(15px + 3px*var(--tx))}

/* ---------- station counts (209 → 40 → 6): data, not step numbers ---------- */
.cnt{position:absolute;width:0;height:0;pointer-events:none;z-index:3;
  transition:opacity .28s var(--ease),transform .38s cubic-bezier(.2,1.5,.35,1)}
.cnt b{position:absolute;display:block;font-family:var(--f-num);font-variant-numeric:tabular-nums;font-weight:600;
  font-size:calc(10.5px*min(var(--tx),1.3));line-height:1;color:var(--ink-2);letter-spacing:.02em;white-space:nowrap;
  padding:2px 3px 1px;border-radius:2px;background:rgba(4,6,10,.74)}
.cnt b.bl{left:0;bottom:0}
.cnt b.bl-r{right:0;bottom:0}
.cnt b.ml{left:0;top:0;transform:translateY(-50%)}
.cnt .ld{position:absolute;height:1px;margin-top:-.5px;background:rgba(154,168,189,.55);transform-origin:0 50%}
.cnt.c6 b{color:#fff;background:rgba(4,6,10,.82);text-shadow:0 0 8px rgba(232,241,255,.6);padding:2px 4px 1px}
.cnt.c6 .ld{background:rgba(232,241,255,.6)}
#stage.pre .cnt{opacity:0;transform:scale(.6)}
#stage.pre .cnt.in,
#stage.pre #nNow.in ~ .cnt.c209,
#stage.pre #nGate.in ~ .cnt.c40,
#stage.pre #nReactor.in ~ .cnt.c6{opacity:1;transform:none}
#stage.brush .cnt{opacity:.45}

/* ---------- gate windows: slow floating motes (the chosen 20 bars, alive) ---------- */
.gwin{position:absolute;overflow:hidden;pointer-events:none;z-index:2}
.gmote{position:absolute;width:3px;height:3px;margin:-1.5px 0 0 -1.5px;border-radius:50%;opacity:0;
  background:radial-gradient(circle,rgba(255,255,255,.95) 0 35%,rgba(var(--mc),.55) 60%,rgba(var(--mc),0) 100%);
  box-shadow:0 0 5px 1px rgba(var(--mc),.45);
  animation:gmote var(--md,9s) ease-in-out var(--mdl,0s) infinite}
@keyframes gmote{
  0%{opacity:0;transform:translate(0,0)}
  18%{opacity:var(--mo,.8)}
  50%{transform:translate(calc(var(--dx)*.55),calc(var(--dy)*.5))}
  82%{opacity:var(--mo,.8)}
  100%{opacity:0;transform:translate(var(--dx),var(--dy))}}
#stage.pre .gwin{opacity:0}
#stage.pre #nGate.in ~ .gwin{opacity:1;transition:opacity .6s ease .2s}
#stage.brush .gwin{opacity:.3}


/* ---- style-2-tiles.css ---- */
/* ================= S2 · order-block mosaic tiles (overrides style.css) ================= */
.tile{background:linear-gradient(180deg,rgba(var(--sc),.06),transparent 60%),rgba(8,12,19,.9)}
/* label plate: near-opaque so text never sits on the ladder colour */
.tile .plate{left:3px;top:3px;padding:3px 5px 3px 4px;gap:1px;max-width:none;border-radius:3px;
  background:linear-gradient(180deg,rgba(9,13,20,.93),rgba(5,7,11,.9));
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.045),0 2px 8px rgba(0,0,0,.45)}
.tile.be .plate{top:6px}
.tile .tkr{max-width:none;overflow:visible;text-overflow:clip;white-space:nowrap;display:block;color:#F4F7FF}
.tile .pc{color:rgb(var(--hi));letter-spacing:-.01em}
.tile.be .pc{color:#FFB0BB}
.tile .row1{gap:6px}
.tile .row1 .tw{display:flex;flex-direction:column;gap:2px;min-width:0}
.tile .mg{border-radius:6px;letter-spacing:.02em;box-shadow:inset 0 1px 0 rgba(255,255,255,.08)}
.tile .sub{display:flex;align-items:center;flex-wrap:wrap;gap:3px 6px;margin-top:3px}
.tile .sub .buc{margin-top:0;background:rgba(var(--sc),.14);color:rgb(var(--hi));box-shadow:inset 0 0 0 1px rgba(var(--sc),.22)}
.tile.be .sub .buc{color:#FFB0BB}
.tile .sub .pips{margin-top:0}
.tile .seccap{position:static;display:inline-block;font-size:calc(7.5px*var(--tx));line-height:1;padding:2px 4px;border-radius:2px;color:var(--ink-2);background:var(--raised);border:1px solid #243044}
/* rank badge: own dark base, so it never reads colour-on-colour over the ladder */
.tile .rk{right:4px;top:4px;height:auto;min-width:0;padding:1.5px 4px 1.5px;line-height:1;border-radius:3px;letter-spacing:.02em;
  color:rgb(var(--hi));
  background:linear-gradient(rgba(var(--sc),.2),rgba(var(--sc),.2)),rgba(6,9,14,.92);
  box-shadow:inset 0 0 0 1px rgba(var(--sc),.42),0 1px 4px rgba(0,0,0,.5)}
.tile.be .rk{color:#FFB0BB}
.tile.pk .rk{padding:2px 5px}
/* hazard tile: text chips fitted in JS; ⊘ badge on a dark base */
.tile.ev .evtxt{left:6px;right:30px;gap:6px}
.tile.ev .evtxt b,.tile.ev .evtxt span{padding:2px 5px;background:rgba(5,7,11,.84)}
.tile.ev .rk{top:50%;transform:translateY(-50%);right:6px;padding:2px 4px;font-size:calc(11px*var(--tx));color:var(--amber);background:rgba(6,9,14,.92);box-shadow:inset 0 0 0 1px rgba(255,176,32,.5)}
/* latch sits over the right edge; keep the LTP notch visible beside it */
.tile .latch{top:22%;bottom:22%}
#stack .tile .plate{max-width:none}
.tile .sub .buc{letter-spacing:.08em;padding:2px 4px;line-height:1}
.tile.c3 .rk,.tile.c4 .rk{padding:1px 3px 1.5px}
.tile .tkr,.tile .pc{width:max-content}

/* ---- style-3-tickets.css ---- */
/* S3 · trade tickets: hero hierarchy, level plan, chip column, 5-min chart, anomaly strip.
   Appended after style.css; overrides only ticket / anomaly internals. */

/* ---- panel: a touch brighter than the base so D stays the brightest zone with a margin ---- */
.ticket.buy{--tbg:radial-gradient(520px 230px at 16% 0%,rgba(25,229,140,.24),transparent 70%),linear-gradient(135deg,rgba(37,112,82,.96),rgba(19,42,47,.96) 74%)}
.ticket.sell{--tbg:radial-gradient(520px 230px at 16% 100%,rgba(255,59,92,.24),transparent 70%),linear-gradient(135deg,rgba(122,35,55,.96),rgba(26,30,42,.96) 74%)}

/* ---- info column ---- */
.ticket .info{display:flex;flex-direction:column;justify-content:space-between}
.ticket .info>div{display:flex;align-items:center;min-width:0;flex:none}
.ticket .rowa{gap:8px}
.ticket .idc{min-width:0;display:flex;flex-direction:column}
.ticket .tkr{letter-spacing:.012em}
.ticket .nm{margin-top:4px;color:var(--ink-2);font-weight:500;letter-spacing:.005em;line-height:1.1}
.ticket .nm .nms{color:var(--ink-3);font-weight:700;letter-spacing:.09em;font-size:.88em}
.ticket .rowb{gap:8px}
.ticket .pill{width:max-content!important;min-width:0!important;flex:none;padding:0 10px 0 calc(10px + .14em);line-height:1}
.ticket.hero .pill{font-size:calc(12.5px*var(--tx))}
.ticket .cring{flex:none}
.ticket .pips{display:flex;gap:3px;flex:none}
.ticket .rowc{gap:7px}
.ticket .lp2{display:flex;flex-direction:column;min-width:0;gap:1px}
.ticket.compact .rowc{align-items:baseline}
.ticket .pc{letter-spacing:-.045em}
/* hero %: the single brightest number on the ticket */
.ticket .hero-pc{line-height:.9;letter-spacing:-.055em;margin-left:-2px;
  background:linear-gradient(180deg,#FFFFFF 0%,rgb(var(--hot)) 42%,rgb(var(--hi)) 100%);
  -webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent;
  text-shadow:none;filter:drop-shadow(0 0 14px rgba(var(--sc),.55))}
.ticket .rowd{gap:7px;align-items:baseline}
.ticket .rowd .ltp{font-weight:600;color:var(--ink);letter-spacing:-.02em}
.ticket .rowd .pts{color:rgb(var(--hi));opacity:1}
.ticket .pctl{font-family:var(--f-num);font-variant-numeric:tabular-nums;font-weight:600;color:var(--ink-2);
  border:1px solid rgba(154,168,189,.42);border-radius:3px;padding:2px 4px 1px;line-height:1;letter-spacing:.02em;align-self:center;white-space:nowrap}

/* ---- chart well ---- */
.ticket .chart{border-radius:6px;background:linear-gradient(180deg,rgba(3,6,10,.16),rgba(3,6,10,.08));box-shadow:inset 0 0 0 1px rgba(255,255,255,.065)}
.chart .lvs svg{position:absolute;left:0;top:0;overflow:visible}
.chart .ob{background:linear-gradient(90deg,rgba(var(--sc),.22),rgba(var(--sc),.12));border:1px solid rgba(var(--sc),.62);border-left:2px solid rgb(var(--hot));box-shadow:-3px 0 10px -4px rgba(var(--sc),.9)}
.chart .ob .t{white-space:nowrap;font-size:calc(7.5px*var(--tx));color:rgb(var(--hot));opacity:.95}
.chart .rl{height:2px;background:rgba(var(--hot),.42)}
.chart .pos .rtag{position:absolute;left:0;right:0;text-align:center;font-family:var(--f-num);font-weight:700;color:rgb(var(--hot));line-height:1;letter-spacing:-.03em}
.chart .lp{width:7px;height:7px;margin:-3.5px 0 0 -3.5px}

/* chip column: tinted/outlined price tags, equal width, values right-aligned */
.ticket .chip2{display:flex;align-items:center;justify-content:space-between;padding:0 5px;border-radius:3px;border:1px solid transparent;
  font-weight:700;letter-spacing:-.02em;box-sizing:border-box}
.ticket .chip2 b{display:block;font-family:var(--f-ui);font-weight:800;letter-spacing:.05em;opacity:.78;margin:0;text-align:left;flex:none;line-height:inherit}
.ticket .chip2 span{flex:none}
.ticket .chip2.k-T2{background:linear-gradient(rgba(var(--sc),.24),rgba(var(--sc),.24)),#0A0E14;border-color:rgba(var(--sc),.95);color:rgb(var(--hot));box-shadow:0 0 10px rgba(var(--sc),.28)}
.ticket .chip2.k-T1{background:linear-gradient(rgba(var(--sc),.10),rgba(var(--sc),.10)),#0A0E14;border:1px dashed rgba(var(--sc),.7);color:rgb(var(--hi))}
.ticket .chip2.k-E{background:linear-gradient(rgba(255,255,255,.14),rgba(255,255,255,.14)),#0A0E14;border-color:rgba(255,255,255,.8);color:#FFFFFF;box-shadow:0 0 8px rgba(255,255,255,.14)}
.ticket .chip2.k-SL{background:linear-gradient(rgba(255,176,32,.2),rgba(255,176,32,.2)),#0A0E14;border-color:rgba(255,176,32,.92);color:#FFC65C}

/* chart legend: build-up over OI / delta */
.ticket .chart .lg2{flex-direction:column;align-items:flex-start;gap:3px;padding:3px 6px 4px 4px;border-radius:4px;background:rgba(4,7,11,.6);box-shadow:inset 0 0 0 1px rgba(255,255,255,.04);overflow:hidden}
.ticket .lg2 .buc{line-height:1.25;padding:1px 5px;background:rgba(var(--sc),.16);box-shadow:inset 0 0 0 1px rgba(var(--sc),.35)}
.ticket .lg2 .oi{line-height:1.1;color:var(--ink-2);letter-spacing:-.02em;padding-left:1px}

/* ---- hero plan strip ---- */
.ticket .plan .cells{display:flex;justify-content:space-between;align-items:flex-end;column-gap:10px;white-space:nowrap}
.ticket .plan .pcell{flex:none}
.ticket .plan .pcell .k{font-family:var(--f-ui);font-weight:700;font-size:var(--lfs);letter-spacing:.13em;line-height:1;margin-bottom:5px;color:var(--ink-3)}
.ticket .plan .pcell .v{font-family:var(--f-num);font-variant-numeric:tabular-nums;font-size:var(--vfs);font-weight:600;line-height:1;letter-spacing:-.025em}
.ticket .plan .rr{font-size:inherit;font-weight:inherit;text-align:right}
.ticket .plan .sl .k{color:rgba(255,176,32,.82)} .ticket .plan .sl .v{color:var(--amber)}
.ticket .plan .en .v{color:#F4F7FB}
.ticket .plan .t1 .k,.ticket .plan .t2 .k{color:rgba(var(--hi),.72)} .ticket .plan .t1 .v,.ticket .plan .t2 .v{color:rgb(var(--hi))}
.ticket .plan .rr .v{color:var(--ink);font-weight:700}
.ticket .plan .rrbar{height:6px;margin-top:8px;border-radius:3px;background:rgba(255,255,255,.05);box-shadow:inset 0 0 0 1px rgba(255,255,255,.04)}
.ticket .plan .rrbar i.r0{border-radius:3px 0 0 3px}
.ticket .plan .rrbar i.r1{border-radius:0 3px 3px 0;box-shadow:0 0 8px rgba(var(--sc),.35)}
.ticket .plan .rrbar i.tk{border-radius:1px}

/* ---- one-line level strip (#2/#3) ---- */
.ticket .lvlstrip{display:flex;justify-content:space-between;align-items:baseline;white-space:nowrap;column-gap:4px}
.ticket .lvlstrip.nosep{column-gap:10px}
.ticket .lvlstrip .g{display:flex;align-items:baseline;gap:4px;flex:none}
.ticket .lvlstrip .k{font-family:var(--f-ui);font-weight:700;font-size:var(--lfs);letter-spacing:.1em;color:var(--ink-3)}
.ticket .lvlstrip .v{font-family:var(--f-num);font-variant-numeric:tabular-nums;font-size:var(--vfs);font-weight:600;letter-spacing:-.03em}
.ticket .lvlstrip .en .v{color:#F4F7FB}
.ticket .lvlstrip .sl .k{color:rgba(255,176,32,.8)} .ticket .lvlstrip .sl .v{color:var(--amber)}
.ticket .lvlstrip .t1 .k,.ticket .lvlstrip .t2 .k{color:rgba(var(--hi),.7)} .ticket .lvlstrip .t1 .v,.ticket .lvlstrip .t2 .v{color:rgb(var(--hi))}
.ticket .lvlstrip .rr .v{color:var(--ink);font-weight:700}
.ticket .lvlstrip .sp{color:var(--ink-4);font-size:var(--vfs);flex:none}
.ticket .lvlstrip.two{flex-direction:column;align-items:stretch;row-gap:6px}
.ticket .lvlstrip .lr{display:flex;justify-content:space-between;align-items:baseline;column-gap:10px}
.ticket .np{font-style:normal;margin:0 -.14em}

/* ---- stacked (phone) ---- */
#stack .ticket .plan.wrap .cells{display:grid;grid-template-columns:auto 1fr auto;column-gap:14px;row-gap:10px;align-items:end}
#stack .ticket .plan.wrap .en{grid-column:span 2}
#stack .ticket .plan.wrap .rr{text-align:right}

/* ---- anomaly strip ---- */
.anom .anin{left:72px;right:10px;gap:14px}
.anom .aid{display:flex;flex-direction:column;gap:4px;line-height:1;min-width:0;flex:none}
.anom .aid .tk{line-height:1}
.anom .aid .sub{font-family:var(--f-ui);font-weight:700;font-size:calc(7.5px*var(--tx));letter-spacing:.12em;color:var(--ink-3);white-space:nowrap}
.anom .apx{display:flex;flex-direction:column;gap:4px;line-height:1;align-items:flex-start;flex:none}
.anom .apx .pc{line-height:1;letter-spacing:-.03em}
.anom .apx .lt{font-size:calc(11px*var(--tx));line-height:1;font-family:var(--f-num);font-variant-numeric:tabular-nums}
.anom .spk{flex:none;opacity:.95}
.anom .tags{display:flex;flex-direction:column;gap:3px;margin-left:auto;flex:none}
.anom .ch{padding:2px 6px;line-height:1.2;text-align:center}
#stack .anom .apx .lt{display:block}
#stack .anom .anin{left:68px;right:8px;gap:10px}
#stack .anom .aid .sub{font-size:7px}
#stack .anom .aid .sub{white-space:normal;max-width:88px;line-height:1.2}

/* ---- refine: verb pill, ring + pips group, readable keys on the card gradient, top rim ---- */
.ticket .pill{border-radius:5px;letter-spacing:.12em;padding:0 12px 0 calc(12px + .12em);box-shadow:inset 0 1px 0 rgba(255,255,255,.45),inset 0 -1px 0 rgba(0,0,0,.18)}
.ticket.hero .pill{font-size:inherit}
.ticket .cgrp{display:flex;align-items:center;gap:5px;flex:none}
.ticket .pips.v{flex-direction:column;gap:2px}
.ticket.compact .pips.v{gap:1px}
.ticket.compact .rowa .tkr{flex:none}
.ticket.compact .rowa .cgrp{margin-left:6px}
.ticket .pips.v i{width:4px;height:4px}
/* keys on the green / crimson gradient: never --ink-3 (near 1:1 there) */
.ticket .plan .pcell .k{color:rgba(255,255,255,.62)}
.ticket .plan .rr .k{color:rgba(255,255,255,.78)}
.ticket .plan .sl .k{color:rgba(255,196,110,.9)}
.ticket .plan .t1 .k,.ticket .plan .t2 .k{color:rgba(var(--hot),.78)}
.ticket .lvlstrip .k{color:rgba(255,255,255,.66)}
.ticket .lvlstrip .sl .k{color:rgba(255,196,110,.92)}
.ticket .lvlstrip .t1 .k,.ticket .lvlstrip .t2 .k{color:rgba(var(--hot),.8)}
.ticket .nm .nms{color:rgba(255,255,255,.5)}
.ticket .chip2 b{opacity:1}
.ticket::before{content:"";position:absolute;left:14px;right:14px;top:0;height:1px;border-radius:1px;pointer-events:none;z-index:1;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.55) 18%,rgba(255,255,255,.55) 82%,transparent)}
/* model-derived fields are marked (dotted underline), real fields are not */
.ticket .oi{text-decoration:underline dotted rgba(154,168,189,.45);text-underline-offset:2px}
.ticket .plan .pcell.kabs{position:relative}
.ticket .plan .pcell.kabs .k{position:absolute;right:0;bottom:100%;white-space:nowrap}
.ticket .lvlstrip .v{line-height:1.15}
.ticket .lvlstrip.two{row-gap:3px}

/* ---- style-9-integration.css ---- */
/* ===== integration: two-row crest on text-lifted screens (1440/1280-class, --tx >= 1.15) =====
   The index grid leaves the crowded first row and runs as one 6-cell row under it; the plume top (G.T0)
   moves down by CREST2_DY so nothing overlaps. 1920 is untouched. */
#stage.crest2 #crest{height:148px}
#stage.crest2 #crest .igrid{left:24px;top:100px;grid-template-columns:repeat(6,max-content);grid-auto-rows:auto;gap:0 6px}
#stage.crest2 #crest .igrid .ic{padding:4px 8px 4px 7px}
#stage.crest2 #crest .clock{left:500px;top:40px}
#stage.crest2 #crest .nifty{left:214px}
/* inspector: the pick-rule row may wrap (sector-cap names) */
#inspector .row.note,#stack .sheet .row.note{white-space:normal;align-items:flex-start}
#inspector .row.note>span:last-child,#stack .sheet .row.note>span:last-child{text-align:right;font-family:var(--f-ui);font-size:.92em;letter-spacing:.02em;color:var(--ink-2);line-height:1.25}
#inspector .g2,#stack .sheet .g2{display:flex;flex-wrap:wrap;overflow:hidden;margin:0 calc(-7px*var(--tx))}
#inspector .g2>.row,#stack .sheet .g2>.row{flex:1 0 50%;min-width:max-content;box-sizing:border-box;margin:0 0 0 -1px;padding:calc(4px*var(--tx)) calc(7px*var(--tx)) 0;border-left:1px solid rgba(154,168,189,.12)}
#stack .sheet .g2{margin:0 -8px} #stack .sheet .g2>.row{padding:5px 8px 0}
#inspector .g2>.row.note,#stack .sheet .g2>.row.note{min-width:0}
#inspector .g2>.row.full,#stack .sheet .g2>.row.full{flex-basis:100%}
.bridge{pointer-events:auto;cursor:pointer}
/* ================= stacked (phone / portrait) layout: the vertical pipeline =================
   Injected by tools/patch_terminal.py at the end of the page's main <style> (after 02.html's own rules, so it wins);
   the light layer (tools/terminal_light.html) is appended after it. Everything is scoped to html.stacked / #stack, so
   the desktop stage and the Home peek frame (never stacked) are untouched. Text floor: 10px real. */

/* the page scrolls: html must not keep overflow:hidden (it goes to the viewport and nothing would scroll) */
html.stacked{height:auto;overflow:visible;overscroll-behavior-y:contain;-webkit-text-size-adjust:100%;text-size-adjust:100%;overflow-anchor:none}
html.stacked body.stacked{height:auto;min-height:100%;overflow-anchor:none}
body.stacked #stack{max-width:none;margin:0;padding:0;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
#stack button{font:inherit;color:inherit;margin:0;-webkit-appearance:none;appearance:none;-webkit-tap-highlight-color:transparent}
#stack button:focus{outline:none}
#stack button:focus-visible{outline:2px solid rgba(169,184,255,.8);outline-offset:1px}

/* ---------- station nav (sticky) ---------- */
#stack .phnav{position:sticky;top:0;z-index:40;height:44px;background:rgba(10,15,23,.82);-webkit-backdrop-filter:blur(12px) saturate(1.4);backdrop-filter:blur(12px) saturate(1.4);border-bottom:1px solid var(--hair)}
#stack .phnavin{position:relative;max-width:760px;height:100%;margin:0 auto;display:flex;align-items:stretch;padding:0 4px 0 12px;box-sizing:border-box}
#stack .phn{position:relative;flex:1 1 0;min-width:44px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:0 2px;background:none;border:0;color:var(--ink-3);cursor:pointer;transition:color .2s}
#stack .phn .c{display:flex;align-items:center;gap:3px;font:700 10px/1 var(--f-ui);letter-spacing:.1em;white-space:nowrap}
#stack .phn .n{font:600 12.5px/1 var(--f-num);font-variant-numeric:tabular-nums;color:var(--ink-2);letter-spacing:.01em}
#stack .phn .tri{width:7px;height:7px;fill:currentColor;flex:none}
#stack .phn.up .tri,#stack .phn.up .n{color:var(--bull)}
#stack .phn.dn .tri,#stack .phn.dn .n{color:var(--bear)}
#stack .phn .bd{display:flex;gap:1px;width:34px;height:3px;border-radius:2px;overflow:hidden}
#stack .phn .bd i{display:block;height:100%;flex:1}
#stack .phn .bd .b{background:var(--bull)} #stack .phn .bd .r{background:var(--bear)}
#stack .phn::after{content:"";position:absolute;left:22%;right:22%;bottom:0;height:2px;border-radius:2px 2px 0 0;background:var(--ink-2);opacity:0;transform:scaleX(.3);transition:opacity .2s,transform .28s var(--ease)}
#stack .phn.up::after{background:var(--bull)} #stack .phn.dn::after{background:var(--bear)}
#stack .phn.on{color:var(--ink)}
#stack .phn.on::after{opacity:1;transform:none}
#stack .phn.find{flex:0 0 44px}
#stack .phn.find svg{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round}
#stack .phprog{position:absolute;left:0;right:0;bottom:-1px;height:1px;background:linear-gradient(90deg,rgba(169,184,255,0),rgba(169,184,255,.22) 30%,rgba(169,184,255,.22) 70%,rgba(169,184,255,0));pointer-events:none}
#stack .phprog i{position:absolute;left:0;top:-1.5px;width:8px;height:4px;border-radius:2px;background:#fff;box-shadow:0 0 6px rgba(169,184,255,.9);will-change:transform}

/* ---------- page, rebuild holder, sections ---------- */
#stack .phpage{position:relative;max-width:760px;margin:0 auto;padding:0 12px 0 26px;box-sizing:border-box}
#stack .phnext{position:relative;height:0;overflow:hidden;visibility:hidden;pointer-events:none}
#stack .phbody{position:relative;padding-top:12px}
#stack .phsec{position:relative;margin:0 0 22px}
#stack .phhd{display:flex;align-items:center;gap:8px;height:26px;margin:0 0 8px;white-space:nowrap}
#stack .phhd b{display:flex;align-items:center;gap:5px;font:800 11px/1 var(--f-ui);letter-spacing:.16em;color:var(--ink)}
#stack .phhd span{font:600 10px/1 var(--f-ui);letter-spacing:.1em;color:var(--ink-3);overflow:hidden;text-overflow:ellipsis}
#stack .phhd::after{content:"";flex:1 1 12px;min-width:12px;height:1px;background:linear-gradient(90deg,var(--hair),rgba(26,36,51,0))}
#stack .phhd .tri{width:8px;height:8px;fill:currentColor}
#stack .phhd.up b{color:var(--bull-hi)} #stack .phhd.dn b{color:var(--bear-hi)}
#stack .phhd.set{margin-top:18px}
#stack .phhd .ev{color:var(--amber)}

/* ---------- spine, station nodes, count badges ---------- */
#stack .phspine{position:absolute;left:-14px;width:2px;bottom:auto;overflow:visible;pointer-events:none;z-index:1;
  background:linear-gradient(180deg,rgba(232,241,255,.2) 0%,rgba(232,241,255,.45) calc(var(--s1,40%) - 12%),rgba(232,241,255,.95) var(--s1,40%),rgba(232,241,255,.55) var(--s2,55%),rgba(232,241,255,.5) calc(var(--s3,85%) - 8%),rgba(232,241,255,.95) var(--s3,85%),rgba(232,241,255,.75) 100%);
  box-shadow:0 0 8px rgba(169,184,255,.45)}
#stack .phnode{position:absolute;left:-13px;z-index:2;width:9px;height:9px}
#stack .phnode.dia{width:7px;height:7px}
#stack .phnode.beacon{width:7px;height:7px}
#stack .phnode.set{width:11px;height:11px}
#stack .phnode .ring{width:7px;height:7px}
#stack .phcnt{position:absolute;width:auto;height:auto;padding:0;margin:0;border:0;background:none;pointer-events:auto;cursor:pointer;z-index:5;transform:none}
#stack .phcnt b{position:relative;left:auto;top:auto;right:auto;bottom:auto;display:block;transform:none}
#stack .phcnt::after{content:"";position:absolute;left:50%;top:50%;width:max(100%,40px);height:max(100%,40px);transform:translate(-50%,-50%)}
#stack .phncnt{left:-13px;transform:translateX(-50%)}
#stack .phcap{position:absolute;width:auto;height:auto;pointer-events:none;z-index:4}

/* ================= phone motion (SPEC §7): the build show's pre states, the ambient layer =================
   Injected by tools/patch_terminal.py after tools/terminal_phone.css (still inside the main <style>, ahead of the light
   layer). A section that has not played its intro carries class phpre on the intro's own element; everything here is
   scoped to it or to #stack, so a rebuild with nothing left to play renders final and the desktop never sees it. */

/* the pre states land at once; CSS loops pause in sections that are off screen */
#stack .phnoanim,#stack .phnoanim *{transition:none!important}
#stack .phoff,#stack .phoff *,#stack .phoff::before,#stack .phoff::after,#stack .phoff *::before,#stack .phoff *::after{animation-play-state:paused!important}
/* the desktop's CSS loops, compositor-only on the phone (transform / opacity; same size, timing and colour):
   the beacon ring and the crest's zero ring scale instead of growing width / height; the card specular sweeps with
   translateX instead of left; the sheen's conic light turns on its own ::before (rotate) instead of animating --ang;
   the reactor's rings turn as two <svg> boxes (split in phFxSplitReactor) instead of SVG <g> transforms */
#stack .beacon .ring{width:80px;height:80px;border-width:2.4px;pointer-events:none;animation-name:phring}
@keyframes phring{0%{transform:translate(-50%,-50%) scale(.075);opacity:.9}35%,100%{transform:translate(-50%,-50%) scale(1);opacity:0}}
#stack .pulse .pz::after{width:30px;height:30px;border-width:1.5px;animation-name:phpzr}
@keyframes phpzr{0%{transform:translate(-50%,-50%) scale(.2);opacity:.9}60%,100%{transform:translate(-50%,-50%) scale(1);opacity:0}}
#stack .ticket .spec::before{left:-140px;animation-name:phspecs}
@keyframes phspecs{0%{transform:translateX(0) skewX(-18deg)}14%,100%{transform:translateX(780px) skewX(-18deg)}}
#stack .ticket .sheen{background:none;animation:none;overflow:hidden}
#stack .ticket .sheen::before{content:"";position:absolute;left:50%;top:50%;width:180%;aspect-ratio:1;margin:-90% 0 0 -90%;pointer-events:none;
  background:conic-gradient(transparent 0 60%,rgba(255,255,255,.9) 70%,rgba(var(--hot),.9) 75%,transparent 85%);animation:phang 8s linear infinite}
@keyframes phang{to{transform:rotate(360deg)}}
#stack .reactor svg g.r1,#stack .reactor svg g.r2{animation:none}
#stack .reactor svg.phr1{animation:spin 24s linear infinite}
#stack .reactor svg.phr2{animation:spin 36s linear infinite reverse}
/* no entrance, glow ring or flare may ever widen the page (a phone would shrink the whole page to fit it) */
#stack .phpage{overflow-x:clip}

/* spine nodes and their count badges wait for their station */
#stack .phwait,#stack.brush .phwait{opacity:0}

/* ---------- MARKET: the setup chips pop, the sectors light in order ---------- */
#stack .phpre .phreact,#stack .phpre .phrailhd .phcnt{transition:opacity .3s var(--ease),transform .5s cubic-bezier(.2,1.5,.35,1)}
#stack .phpre .phreact:not(.in){opacity:0;transform:scale(.4)}
#stack .phpre .phrailhd .phcnt:not(.cntpop){opacity:0}
#stack .phpre .phpick{transition:opacity .3s var(--ease),transform .45s cubic-bezier(.2,1.4,.4,1),box-shadow .14s}
#stack .phpre .phpick:not(.in){opacity:0;transform:translateY(8px) scale(.94)}
#stack .phpre .schips .chip{transition:opacity .32s var(--ease),transform .32s var(--ease),border-color .14s,box-shadow .14s}
#stack .phpre .schips .chip:not(.in){opacity:0;transform:translateY(5px)}

/* ---------- FLOW: the canvases are clipped from script; NOW, nodes, captions, labels and windows wait ---------- */
#stack .phflow.phpre .nowline,#stack .phflow.phpre .nowglow,#stack .phflow.phpre .gwin,#stack .phflow.phpre .phwin,#stack .phflow.phpre .phcrash{transition:opacity .45s var(--ease)}
#stack .phflow.phpre .phaxis .lb,#stack .phflow.phpre .phaxis svg,#stack .phflow.phpre .phhours span,#stack .phflow.phpre .phhours i{transition:opacity .3s var(--ease)}
#stack .phflow.phpre .nowline:not(.in),#stack .phflow.phpre .nowglow:not(.in),#stack .phflow.phpre .node:not(.in),
#stack .phflow.phpre .phcap:not(.cntpop),#stack .phflow.phpre .gwin:not(.in),#stack .phflow.phpre .phwin:not(.in),
#stack .phflow.phpre .phcrash:not(.in),#stack .phflow.phpre .phaxis .lb:not(.in),#stack .phflow.phpre .phaxis svg:not(.in),
#stack .phflow.phpre .phhours span:not(.in),#stack .phflow.phpre .phhours i:not(.in){opacity:0}
#stack .phflow.phpre .phwalls{animation:none}
/* the walls breathe (the desktop's wallsh) once the flow has played, and step back with the rest under a brush */
#stack:not(.brush) .phflow:not(.phpre) .phwalls{animation:wallsh 5.3s ease-in-out infinite}
/* the replay head (09:15 → NOW) */
#stack .phscan{position:absolute;width:2px;margin-left:-1px;pointer-events:none;opacity:0;z-index:3;will-change:transform,opacity;
  background:linear-gradient(180deg,transparent,rgba(232,241,255,.55) 12%,rgba(232,241,255,.75) 50%,rgba(232,241,255,.55) 88%,transparent);
  box-shadow:0 0 10px rgba(169,184,255,.55),0 0 2px rgba(255,255,255,.6)}
#stack .phscan::before{content:"";position:absolute;top:0;bottom:0;right:1px;width:44px;background:linear-gradient(90deg,transparent,rgba(169,184,255,.08));
  -webkit-mask:linear-gradient(180deg,transparent,#000 12%,#000 88%,transparent);mask:linear-gradient(180deg,transparent,#000 12%,#000 88%,transparent)}

/* ---------- BRANCH: the lens band's own particle layer; tiers build tile by tile ---------- */
#stack .phlens canvas.phlensfx{pointer-events:none}
#stack.brush .phlens canvas.phlensfx{opacity:.9}
#stack .phtier.phpre .phthd,#stack .phtier.phpre .phecho{transition:opacity .35s var(--ease)}
#stack .phtier.phpre:not(.go) .phthd,#stack .phtier.phpre:not(.go) .phecho{opacity:0}
#stack .phpre .tile:not(.in){opacity:0;transform:translateY(8px)}
#stack .phpre .tile:not(.in) .br{transform:scale(1.3);opacity:0}

/* ---------- SETUP BAYS: reticle lock-on, bridge, the desktop card entrance (from the bridge above) ---------- */
#stack .phbay.phpre .tile:not(.in){transform:translateY(-6px)}
/* the reticle locks on: its four corners close in on the tile (a full-width box scaled up would leave the screen) */
#stack .phbay.phpre .ret{transition:opacity .2s var(--ease)}
#stack .phbay.phpre .ret i{transition:transform .34s cubic-bezier(.2,1.45,.35,1)}
#stack .phbay.phpre .ret:not(.in){opacity:0}
#stack .phbay.phpre .ret:not(.in) i:nth-child(1){transform:translate(-14px,-12px)}
#stack .phbay.phpre .ret:not(.in) i:nth-child(2){transform:translate(14px,-12px)}
#stack .phbay.phpre .ret:not(.in) i:nth-child(3){transform:translate(-14px,12px)}
#stack .phbay.phpre .ret:not(.in) i:nth-child(4){transform:translate(14px,12px)}
#stack .phbay.phpre .phbridge{transition:transform .24s var(--ease),opacity .2s}
#stack .phbay.phpre .phbridge:not(.in){opacity:0;transform:scaleY(0)}
#stack .phbay.phpre .phbridge.h:not(.in){transform:scaleX(0)}
#stack .phbay.phpre .ticket:not(.in),#stack .phbay.phpre .anom:not(.in){opacity:0;transform:translateY(-14px) scale(.97) perspective(900px) rotateX(7deg);filter:blur(8px)}
#stack .phbay.row.phpre .ticket:not(.in),#stack .phbay.row.phpre .anom:not(.in){transform:translateX(-24px) scale(.97) perspective(900px) rotateY(-6deg)}
#stack .phbay.phpre .ticket .cc{clip-path:inset(0 100% 0 0)}
#stack .phbay.phpre .ticket.in .cc{clip-path:inset(0 0 0 0);transition:clip-path .4s linear .12s}
#stack .phbay.phpre .ticket .ob{transform:scaleX(0)}
#stack .phbay.phpre .ticket.in .ob{transform:none;transition:transform .25s var(--ease) .5s}
#stack .phbay.phpre .ticket .chip2,#stack .phbay.phpre .ticket .lvl,#stack .phbay.phpre .ticket .pos,#stack .phbay.phpre .ticket .lp{opacity:0;transform:translateX(10px)}
#stack .phbay.phpre .ticket.in .chip2,#stack .phbay.phpre .ticket.in .lvl,#stack .phbay.phpre .ticket.in .pos,#stack .phbay.phpre .ticket.in .lp{opacity:1;transform:none;transition:opacity .3s .55s,transform .35s var(--ease) .55s}
#stack .phbay.phpre .ticket .rrbar i{transform:scaleX(0);transform-origin:0 50%}
#stack .phbay.phpre .ticket.in .rrbar i{transform:none;transition:transform .45s var(--ease) .35s}
/* the lock-on flash over a pick's tile, and a packet running a bridge */
#stack .phlock{position:absolute;left:0;top:0;right:0;bottom:0;border-radius:inherit;pointer-events:none;z-index:5;background:rgba(255,255,255,.16)}
#stack .phpk{position:absolute;left:50%;top:0;width:12px;height:12px;margin:-6px 0 0 -6px;border-radius:50%;pointer-events:none;z-index:2;
  background:radial-gradient(circle,#fff 0 22%,rgba(var(--sc),.9) 45%,rgba(var(--sc),0) 70%)}
#stack .phbridge.h .phpk{left:0;top:50%}

/* ---------- ambient: the spine comet and the sweep band ---------- */
#stack .phcomet{position:absolute;left:-13px;top:0;width:0;height:0;z-index:2;pointer-events:none;opacity:0;will-change:transform,opacity}
#stack .phcomet i{position:absolute;left:-1.5px;top:-86px;width:3px;height:86px;border-radius:2px;background:linear-gradient(180deg,rgba(232,241,255,0),rgba(232,241,255,.85));filter:drop-shadow(0 0 3px rgba(169,184,255,.9))}
#stack .phcomet b{position:absolute;left:-3.5px;top:-3.5px;width:7px;height:7px;border-radius:50%;background:#fff;box-shadow:0 0 10px 3px rgba(169,184,255,.75)}
#stack.brush .phcomet i,#stack.brush .phcomet b{opacity:.4}
#stack .phsweep{position:fixed;left:0;right:0;top:0;height:150px;margin-top:-75px;pointer-events:none;z-index:30;opacity:0;will-change:transform,opacity;
  background:linear-gradient(180deg,rgba(255,255,255,0),rgba(255,255,255,.05) 50%,rgba(255,255,255,0))}

/* ---------- ↻ replay (FLOW header) ---------- */
#stack .phhd .phreplay{order:2;position:relative;flex:none;display:flex;align-items:center;justify-content:center;width:28px;height:28px;margin:0 0 0 4px;padding:0;border-radius:50%;
  border:1px solid var(--hair);background:var(--raised);color:var(--ink-3);cursor:pointer;transition:color .15s,border-color .15s}

#stack .phhd .phreplay svg{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}

/* ---- desktop stock search (tools/terminal_find.js): a field above the stage's top-left corner (in the row
   computeScale keeps clear), the matches in a list under it, drawn like the popup. Light colours: terminal_light.html ---- */
#obFind{position:fixed;left:0;top:0;z-index:45;width:440px;font-family:var(--f-ui);opacity:0;transform:translateY(-3px);
  transition:opacity .5s var(--ease) .15s,transform .5s var(--ease) .15s}
#obFind.in{opacity:1;transform:none}
body.stacked #obFind{display:none}
#obFind .obf-f{position:relative;display:flex;align-items:center;width:300px;height:30px;border-radius:9px;border:1px solid var(--hair);
  background:var(--panel);transition:width .28s var(--ease),border-color .15s,box-shadow .15s}
#obFind .obf-f:hover{border-color:#243044}
#obFind.open .obf-f,#obFind .obf-f:focus-within{width:440px;border-color:rgba(169,184,255,.45);box-shadow:0 0 0 3px rgba(124,140,255,.1)}
#obFind .obf-f svg{position:absolute;left:10px;top:50%;width:16px;height:16px;margin-top:-8px;fill:none;stroke:var(--ink-3);stroke-width:1.7;stroke-linecap:round;pointer-events:none}
#obFind input{flex:1;min-width:0;height:100%;margin:0;padding:0 8px 0 33px;border:0;outline:0;background:none;color:var(--ink);
  font:500 13px/1 var(--f-ui);letter-spacing:.01em;-webkit-appearance:none;appearance:none}
#obFind input::placeholder{color:var(--ink-2);opacity:.8}
#obFind input::-webkit-search-cancel-button,#obFind input::-webkit-search-decoration{-webkit-appearance:none;appearance:none;display:none}
#obFind kbd{flex:none;margin-right:6px;padding:3px 6px 2px;border-radius:5px;border:1px solid var(--hair);background:none;color:var(--ink-3);
  font:600 10px/1 var(--f-ui);letter-spacing:.04em;white-space:nowrap;transition:opacity .15s}
#obFind.open kbd,#obFind .obf-f:focus-within kbd{opacity:0}
#obFind .obf-l{position:absolute;left:0;top:36px;width:440px;overflow-y:auto;overscroll-behavior:contain;padding:4px;border-radius:10px;
  border:1px solid #243044;background:rgba(7,10,15,.975);box-shadow:0 18px 40px rgba(0,0,0,.62),0 0 0 1px rgba(0,0,0,.4),inset 0 1px 0 rgba(255,255,255,.05);
  scrollbar-width:thin;scrollbar-color:rgba(154,168,189,.22) transparent;animation:obfIn .16s var(--ease)}
#obFind .obf-l[hidden]{display:none}
@keyframes obfIn{from{opacity:0;transform:translateY(-4px)}}
#obFind .obf-r{display:grid;grid-template-columns:84px minmax(0,1fr) 62px 96px;align-items:center;column-gap:10px;height:34px;padding:0 10px;
  border-radius:7px;cursor:pointer}
#obFind .obf-r .tk{font:700 15px/1 var(--f-tk);letter-spacing:.01em;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#obFind .obf-r .nm{font:500 11.5px/1.2 var(--f-ui);color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#obFind .obf-r .nm em{font-style:normal;font-weight:600;letter-spacing:.03em}
#obFind .obf-r .pc{font:600 12px/1 var(--f-num);font-variant-numeric:tabular-nums;text-align:right;color:var(--ink-2)}
#obFind .obf-r .pc.up{color:var(--bull-hi)} #obFind .obf-r .pc.dn{color:var(--bear-hi)} #obFind .obf-r .pc.ev{color:var(--crash)}
#obFind .obf-r .st{display:flex;align-items:center;justify-content:flex-end;gap:3px;font:700 10px/1 var(--f-ui);letter-spacing:.05em;white-space:nowrap;color:var(--ink-3)}
#obFind .obf-r .st .tri{width:7px;height:7px;fill:currentColor}
#obFind .obf-r .st.up{color:var(--bull-hi)} #obFind .obf-r .st.dn{color:var(--bear-hi)} #obFind .obf-r .st.ev{color:var(--amber)}
#obFind .obf-r.on{background:rgba(232,241,255,.06)}
#obFind .obf-r.on.up{box-shadow:inset 2px 0 0 var(--bull)} #obFind .obf-r.on.dn{box-shadow:inset 2px 0 0 var(--bear)} #obFind .obf-r.on.ev{box-shadow:inset 2px 0 0 var(--amber)}
#obFind .obf-none{padding:18px 10px;font:600 11px/1.3 var(--f-ui);letter-spacing:.06em;color:var(--ink-3);text-align:center}

/* OrderBlock · light theme. The terminal follows the app's sun / moon toggle: the parent page posts
   {t:'ob-theme'} on every change. Dark until the member picks a theme; "System" follows the device. The dark
   design draws on canvases with dark-theme colours; in light mode those colours are remapped as they

    var m = /(?:^|;\s*)ob_theme=(light|dark|system)/.exec(document.cookie); return m ? m[1] : 'dark';
  }

    // light "ink" of the dark design -> navy ink

(function () {
  "use strict";
  var feed = window.OBF_FEED = {
    data: null,

      if (opts.side !== undefined) feed.filter.side = opts.side;

    const pts = raw.map((y, i) => { if (i === 0 || i === raw.length - 1) return [i ? xOfC(i - 1) : 66, y]; const a = raw[Math.max(0, i - 1)], b = raw[Math.min(raw.length - 1, i + 1)]; return [xOfC(i - 1), (a + 2 * y + b) / 4]; });

/* ================= sector chips ================= */

  const top = secs.filter(x => x.chg > 0), bot = secs.filter(x => x.chg <= 0);
  const chips = [];

    const c = el('div', 'chip fade0', root); css(c, { left: 72, top: y }); c.dataset.sec = x.sec;
    c.classList.add(x.chg > 0 ? 'up' : 'dn');

    c.innerHTML = `<div class="r1"><span class="cap">${x.sec}</span><span class="v">${pctStr(x.chg)}</span></div><div class="strip">${strip}</div>`;

  const splitMin = lo + ch + 8 + Math.max(0, nT - 1) * pm;

  top.forEach((x, i) => mk(x, lo + i * pT));

  // the value never shrinks

/* ---------------- a branch: lens band + tiers c4 → c3 → c2 inside echo brackets ---------------- */

  const m = B.M, geo = B.geo, W = B.W, sd = phSd(side), mos = m.mos[sd];
  const rec = phSection(B, sd, 'branch', 'branch:' + sd, { side });
  phSideVars(rec.el, side);

  phHead(rec.el, 'hd:' + sd, `<b>${PH_TRI[side]}${side > 0 ? 'BULLISH' : 'BEARISH'}</b><span>${nCont} CONTENDERS</span>`, side > 0 ? 'up' : 'dn');
  const lensBox = el('div', 'phlens', rec.el); lensBox.dataset.anchor = 'lens:' + sd; css(lensBox, { height: geo.lensH });
  const tiersEl = el('div', 'phtiers', rec.el);
  const land = {};
  const all = m.selected.filter(s => s.side === side && !s.event);
  const cMax = Math.max(0.01, ...all.map(s => Math.abs(s.c)));
  ['c4', 'c3', 'c2'].forEach(key => {
    const list = mos[key]; if (!list.length) return;
    const t = geo.tier[key], n = t.n, gap = geo.gap, Wc = Math.floor((W - (n - 1) * gap) / n);
    const ranks = list.map(s => s.rank);
    const tier = el('div', 'phtier', tiersEl); tier.dataset.anchor = `tier:${sd}:${key}`;
    el('div', 'phthd', tier, `<span class="k">RANK ${String(Math.min(...ranks)).padStart(2, '0')}–${String(Math.max(...ranks)).padStart(2, '0')}</span><span class="n">${list.length}</span>`);
    const tb = el('div', 'phtb', tier);

    const Ts = [], rows = [];

      const row = list.slice(i, i + n), mean = row.reduce((a, s) => a + Math.abs(s.c), 0) / row.length;
      const h = Math.round(t.base * (0.8 + 0.4 * mean / cMax));

    Ts.forEach(T => { if (T.plate) readTilePlate(T); });
    Ts.forEach(T => { if (T.plate) finishTile(T); if (T.cv) T.cv.style.opacity = COLDIM[key]; T.built = true; B.tiles.push(T); B.tileBy[T.s.s] = T; });

/* the lens band: a slit fed by the gate window (one notch per contender, rank order), a cone widening to the tiers,

function phLens(box, side, W, H, land, m) {
  const { cv, ctx } = localCanvas(box, W, H, S.dpr, 'phlenscv');
  const list = m.selected.filter(s => s.side === side).sort((a, b) => (a.event - b.event) || (a.rank - b.rank));

function phLensDraw(L, hi) {

    const x0 = L.notch[s.s], x1 = L.land[s.s]; if (x0 == null || x1 == null) return;
    const on = hi && hi.has(s.s); if (on) { lit.push(s); return; }

    ctx.beginPath(); ctx.moveTo(x0, slitY + 2); ctx.bezierCurveTo(x0, slitY + (rimY - slitY) * .5, x1, rimY - (rimY - slitY) * .45, x1, rimY); ctx.stroke(); ctx.restore();
  });

  ctx.save(); ctx.shadowColor = `rgba(${rgb},.9)`; ctx.shadowBlur = 8 * k; ctx.fillStyle = `rgba(${rgb},.85)`; ctx.fillRect(sx0 - 3, slitY - 1, sx1 - sx0 + 6, 2); ctx.restore();
  ctx.fillStyle = `rgba(${hot},.9)`; ctx.fillRect(sx0 - 1, slitY - .5, sx1 - sx0 + 2, 1);
  L.list.forEach(s => {
    const x = L.notch[s.s], on = hi && hi.has(s.s);

}

  const above = n => !!(n.compareDocumentPosition(tg.el) & Node.DOCUMENT_POSITION_FOLLOWING);

    const side = (sec.side || -1) > 0 ? 1 : -1;

}

/* ---------------- the intro runner: timed beats + tweens (always at their own pace) ---------------- */

  run.tw.forEach(w => { if (!w.done) { try { w.fn(w.ease(1)); } catch (x) { } w.done = true; } });

/* a tap during an intro waits (PH.holdUntil) for the intros playing now to end on their own: nothing is sped up. It
   waits once: when it comes back it goes, even if the cascade has started the next intro. Only queued intros (about

  if (end > now) { PX.qw = 0; PH.holdUntil = Math.max(PH.holdUntil, end + 40); PX.tapGo = PH.holdUntil + 300; return; }
  if (!PX.tq.length && !PX.bq.length) return;

};

  FX.pinned = h || null; applyBrush(h || null, s ? obFindAt(s, h.at) : undefined);
}
/* the point a click on the stock would come from: where its popup stood (beside its setup card, or the same point of
   the flow, now on the stock's lane, or of the market picture), else its tile's centre, else its lane at NOW */
function obFindAt(s, at) {

  const pt = (x, y, target) => ({ clientX: r.left + x * k, clientY: r.top + y * k, target });
  if (at && at.how === 'k' && K && K.el && !K.event) return pt(K.x + K.w / 2, K.cy, K.el);
  if (at && at.how === 'p') return pt(at.x, at.dy != null ? G.laneY(s.lane) + at.dy : at.y, st);

function obFindPick(i) {

function obFindPin(sym, pulse) {
  clearTimeout(FIND.wait);
  if (FX.show) { FIND.wait = setTimeout(() => obFindPin(sym, pulse), 150); return; }   // the build show plays untouched: the pick waits for its end
  if (!M || !G || !M.bySym[sym]) return;
  const h = { kind: 'stock', sym, find: 1 };
  if (pulse) h.rev = performance.now();    // a light runs the stock's path back to the market picture

}
/* a re-render (the minute update, a resize) rebuilds the page and drops what was lit. The pins come back: the
   search's own, and a stock or sector pinned with a click on the page, its popup where it stood. An open list keeps
   its text, its place and its lit stock with the new minute's figures. */
/* a pin in a fresh object (a lit path caches the layout it was drawn on). A stock whose popup is open notes where it
   stands, as placeInspector placed it: beside its setup card ('k'), around its tile ('t') or at a point of the stage
   ('p'; on a lane of the flow, its offset in the lane, so it rides along when the stock changes lanes). The lane is
   read on the layout the popup was placed on (the page may since have been the phone's, which has its own G) */
function obFindCopy(p) {
  if (!p) return null;
  const i = $('#inspector'), c = { kind: p.kind, sym: p.sym, sec: p.sec, find: p.find, t0: p.t0, at: p.at };
  if (p.kind === 'stock' && i && i.classList.contains('on') && i._sym === p.sym && i._at && i._atG) {
    const [x, y] = i._at, g = i._atG, lane = !i._fixed && x >= 66 && x <= 696 && y >= g.T0 && y < g.T1;
    c.at = { how: i._fixed ? i._fixed[0] : 'p', x, y, dy: lane ? y - g.T0 - (Math.floor((y - g.T0) / g.P) + 0.5) * g.P : null };

}
function obFindKeep() {
  const p = FX.pinned;

    held: p && !p.find && (p.kind === 'stock' || p.kind === 'sector') ? obFindCopy(p) : null,   // pinned with a click

}
function obFindRestore(k) {

  if (!k || S.stacked) return;
  FIND.pv = null; FIND.prev = null;
  if (FIND.open) {
    const sym = FIND.items[FIND.at] ? FIND.items[FIND.at].s : '', top = FIND.box.scrollTop;
    FIND.items = obFindItems(FIND.q); FIND.at = sym ? FIND.items.findIndex(s => s.s === sym) : -1;
    FIND.box.innerHTML = obFindRows(); FIND.box.scrollTop = top; obFindAria();
  }
  if (k.pv && FIND.open && FIND.at >= 0) { FX.pinned = k.prev; obFindPreview(FIND.at); }
  else if (k.pv && k.prev) obFindApply(k.prev);
  else if (k.pin) obFindPin(k.pin, false);

if (!OB_PEEK) {
  window.addEventListener('keydown', e => {
    if (!M || e.defaultPrevented || e.isComposing) return;
    if (FIND.open && e.key === 'Escape') { e.preventDefault(); e.stopPropagation(); obFindClose(); FIND.inp.blur(); return; }
    const t = e.target; if (t && t.closest && t.closest('input,textarea,select,[contenteditable]')) return;
    const k = (e.key || '').toLowerCase(), mod = (e.metaKey || e.ctrlKey) && !e.altKey && !e.shiftKey;
    if ((mod && (k === 'k' || k === 'f')) || (k === '/' && !e.metaKey && !e.ctrlKey && !e.altKey)) { e.preventDefault(); e.stopPropagation(); obFindOpen(); }
  }, true);
  window.addEventListener('message', e => { if (e.origin === location.origin && e.data && e.data.t === 'ob-find') obFindOpen(); });
}


function obControlsMount() {

  // Bind Left Sidebar Rail expand/collapse & theme toggle
  const rail = document.getElementById("obSideRail");
  if (rail && !rail._mounted) {
    rail._mounted = true;
    const toggleBtn = document.getElementById("obRailToggle");
    if (toggleBtn) {
      toggleBtn.addEventListener("click", () => {
        const exp = document.body.classList.toggle("rail-expanded");
        toggleBtn.textContent = exp ? "«" : "»";
        if (typeof rerender === "function") rerender(true);
      });
    }
    const themeBtns = [...rail.querySelectorAll(".rt-btn")];
    const syncThemeBtns = (theme) => {
      themeBtns.forEach(b => b.classList.toggle("on", b.dataset.themeSet === theme));
    };
    const curTheme = document.documentElement.getAttribute("data-theme") === "light" ? "light" : "dark";
    syncThemeBtns(curTheme);
    themeBtns.forEach(btn => {
      btn.addEventListener("click", () => {
        const nextTheme = btn.dataset.themeSet === "light" ? "light" : "dark";
        document.cookie = "ob_theme=" + nextTheme + ";path=/;max-age=31536000";
        syncThemeBtns(nextTheme);
        window.postMessage({ t: "ob-theme", theme: nextTheme }, location.origin);
      });
    });
  }

  const bar = document.getElementById("obTopBar");
  if (!bar || bar._mounted || OB_PEEK) return;
  bar._mounted = true;

  const secSel = bar.querySelector("#obSecSel");
  const sortSel = bar.querySelector("#obSortSel");
  const pills = [...bar.querySelectorAll(".obc-pill")];
  const syncBtn = bar.querySelector("#obSyncBtn");

  if (secSel) {
    secSel.addEventListener("change", () => {
      OBF_FEED.load({ sector: secSel.value });
    });
  }
  if (sortSel) {
    sortSel.addEventListener("change", () => {
      OBF_FEED.load({ sort: sortSel.value });
    });
  }
  pills.forEach(btn => {
    btn.addEventListener("click", () => {
      const nextSide = btn.dataset.side;
      const prevSide = (OBF_FEED.filter && OBF_FEED.filter.side) || "ALL";
      if (nextSide === prevSide) return;
      pills.forEach(p => p.classList.toggle("on", p === btn));
      if (window.gsap) {
        gsap.fromTo("#tickets, #ladderWrap, #plumeWrap", { opacity: 0.52 }, { opacity: 1, duration: 0.24, ease: "power2.out", overwrite: "auto" });
      }
      OBF_FEED.load({ side: nextSide });
    });
  });
  if (syncBtn) {
    syncBtn.addEventListener("click", () => {
      syncBtn.style.transform = "rotate(360deg)";
      OBF_FEED.load();
      setTimeout(() => { syncBtn.style.transform = "none"; }, 400);
    });
  }

  // Live clock ticker
  const clockEl = document.getElementById("obLiveClock");
  if (clockEl) {
    const updateClk = () => {
      const now = new Date();
      const hrs = String(now.getHours()).padStart(2, '0');
      const min = String(now.getMinutes()).padStart(2, '0');
      const sec = String(now.getSeconds()).padStart(2, '0');
      clockEl.textContent = `LIVE ${hrs}:${min}:${sec}`;
    };
    updateClk();
    setInterval(updateClk, 1000);
  }
}

function obControlsPlace() {
  obControlsMount();
  const meta = (M && M.D && M.D.meta) || {};
  const counts = meta.counts || { all: M ? M.lanes.length : 218, bull: M ? M.nBullAll : 0, bear: M ? M.nBearAll : 0 };
  const cAll = document.getElementById("obCntAll"), cBull = document.getElementById("obCntBull"), cBear = document.getElementById("obCntBear");
  if (cAll) cAll.textContent = counts.all;
  if (cBull) cBull.textContent = counts.bull;
  if (cBear) cBear.textContent = counts.bear;

  const secSel = document.getElementById("obSecSel");
  if (secSel && Array.isArray(meta.allSectors)) {
    const cur = (OBF_FEED.filter && OBF_FEED.filter.sector) || "ALL";
    let htmlOpts = `<option value="ALL">All Sectors (${counts.universeTotal || counts.all})</option>`;
    meta.allSectors.forEach(s => {
      const sign = s.chg >= 0 ? "+" : "−";
      htmlOpts += `<option value="${s.sec}">${s.sec} (${s.n} · ${sign}${Math.abs(s.chg).toFixed(2)}%)</option>`;
    });
    if (secSel._lastHtml !== htmlOpts) {
      secSel.innerHTML = htmlOpts;
      secSel._lastHtml = htmlOpts;
    }
    secSel.value = cur;
  }
}

/* ================= main ================= */
let M = null, G = null;
const TX_REAL = 11.6, TX_MAX = 1.39;
const FOOT_TXT = '';
function computeScale() {
  const W = window.innerWidth, H = window.innerHeight;
  S.stacked = W < 800 || W / H < 1.05;
  S.crest2 = false;
  S.dpr = Math.min(2, window.devicePixelRatio || 1);
  S.reduced = false;
  if (!S.stacked) {
    const railEl = document.getElementById('obSideRail');
    const LEFT_RAIL_W = railEl ? (document.body.classList.contains('rail-expanded') ? 190 : 50) : 0;
    const TOP_BAR_H = 36;
    const availH = Math.max(400, H - TOP_BAR_H);
    const availW = Math.max(600, W - LEFT_RAIL_W);
    if (availW / 1920 <= availH / 1080) {
      S.s = availW / 1920;
      S.W = 1920;
      S.Hd = Math.max(920, Math.round(availH / S.s));
    } else {
      S.s = availH / 1080;
      S.Hd = 1080;
      S.W = Math.max(1920, Math.round(availW / S.s));
    }
    S.tx = S.s >= 0.95 ? 1 : Math.min(1.18, 1 / Math.sqrt(S.s));
    S.k = S.s * S.dpr;
    S.tier3 = S.s >= 0.8;
    S.crest2 = S.tx >= 1.15;
    S.left = LEFT_RAIL_W;
    S.top = TOP_BAR_H;
  }
}
function renderStage() {
  const st = $('#stage'), obKeep = obFindKeep();
  if (typeof FX !== 'undefined') { FX.hover = null; FX.pinned = null; }
  if (typeof PH !== 'undefined') PH.gen++;
  st.classList.remove('brush'); const ins = $('#inspector'); if (ins) { ins.classList.remove('on'); ins._at = null; }
  G = layout(S.Hd, M);
  css(st, { width: G.W, height: S.Hd, left: S.left, top: S.top }); st.style.transform = `scale(${S.s})`;
  st.classList.toggle('t3off', !S.tier3); st.style.setProperty('--tx', S.tx); st.style.setProperty('--txc', S.crest2 ? Math.min(S.tx, 1.3) : Math.min(S.tx, 1.08)); st.classList.toggle('crest2', !!S.crest2);
  document.documentElement.style.setProperty('--tx', S.tx);
  buildCrest(M, G, $('#crest'));
  const pw = $('#plumeWrap'); pw.innerHTML = ''; pw._lens = null;
  drawAxis(M, G, pw); drawPlume(M, G, pw); drawWalls(M, G, pw);
  buildChips(M, G, $('#chips'));
  const lw = $('#ladderWrap'); lw.innerHTML = ''; lw._lens = null;
  drawLadder(M, G, lw); drawLens(M, G, lw, null); drawSpine(M, G, lw);
  buildNodes(M, G, $('#nodes'));
  buildTiles(M, G, $('#tiles'));
  buildBridges(M, G, $('#bridges'));
  buildTickets(M, G, $('#tickets'));
  const f = $('#footer'); if (f) { css(f, { top: S.Hd - 21 }); f.textContent = FOOT_TXT; }
  if (typeof afterRender === 'function') afterRender();
  obFindRestore(obKeep); obControlsPlace();   // the field placed over the new stage, the pin and the list back (terminal_find.js)
}
function boot() {
  if (OB_PEEK) { obPeekBoot(); return; }
  try {
    M = buildModel(OBF_FEED.data);
  } catch (e) { console.warn('model failed', e); return; }
  computeScale();
  document.body.classList.toggle('stacked', S.stacked); document.documentElement.classList.toggle('stacked', S.stacked);
  let started = false;
  const go = () => {
    if (started) return;
    if (!window.innerWidth || !window.innerHeight) return;   // no size yet: the resize handler starts it
    started = true; computeScale(); document.body.classList.toggle('stacked', S.stacked); document.documentElement.classList.toggle('stacked', S.stacked);
    try {
      if (S.stacked) { if (typeof renderStack === 'function') renderStack(); }
      else renderStage();
    } catch (e) { console.warn('render failed', e); }
    if (!S.stacked) {
      try {
        finalState();
      } catch (e) {
        console.warn('show failed', e);
        $('#stage').classList.remove('pre');
      }
    }
  };
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { if (!started) go(); else lateFonts(); });
  setTimeout(go, 20);
  let to = null; window.addEventListener('resize', () => { clearTimeout(to); to = setTimeout(() => { if (started) rerender(true); else go(); }, 75); });
}
let LATE_FONTS = false;
function lateFonts() {
  if (LATE_FONTS) return; LATE_FONTS = true;
  const doIt = () => { if (FX.show) { setTimeout(doIt, 300); return; } rerender(); };
  doIt();
}
function rerender(resize) {
  if (!window.innerWidth || !window.innerHeight) return;   // hidden / unsized frame: the next resize renders
  const was = S.stacked; computeScale();
  if (resize && was && S.stacked && typeof phKeep === 'function' && phKeep()) return;   // phone: same width and theme, nothing to rebuild
  document.body.classList.toggle('stacked', S.stacked); document.documentElement.classList.toggle('stacked', S.stacked);
  try {
    if (S.stacked) { if (typeof renderStack === 'function') renderStack(); }
    else { renderStage(); if (typeof settleShow === 'function') settleShow(); }
  } catch (e) { console.warn('rerender failed', e); }
}
OBF_FEED.onUpdate = function (d) { if (FX.show) { setTimeout(() => { if (OBF_FEED.data === d) OBF_FEED.onUpdate(d); }, 300); return; }
  let m2; try { m2 = buildModel(d); } catch (e) { console.warn('model failed', e); return; } M = m2; if (OB_PEEK) { if (PEEK) obPeek(PEEK); } else rerender(); };
OBF_FEED.ready.then(function () { if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot); else boot(); });

})();
