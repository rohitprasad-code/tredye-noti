<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light dark">
<script>(function(){try{var m=/(?:^|;\s*)ob_theme=(light|dark)(?:;|$)/.exec(document.cookie);var ov=m?m[1]:null;var mqL=window.matchMedia&&window.matchMedia('(prefers-color-scheme: light)');var mqD=window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)');var sys=(mqL&&mqL.matches)?'light':(mqD&&mqD.matches)?'dark':'dark';var t=ov||sys;var r=document.documentElement;r.setAttribute('data-theme',t);r.style.colorScheme=t;var mc=document.querySelector('meta[name="color-scheme"]');if(mc)mc.content=ov||'light dark';}catch(e){}})();</script>
<title>OrderBlock — 5-Stage Visual Funnel</title>
<link rel="stylesheet" href="/vendor/fonts.css">
<link rel="stylesheet" href="/static/ob/orderblock.css">
<link rel="stylesheet" href="/static/ob/orderblock-light.css" id="obf-light">
<script defer src="/vendor/gsap.min.js"></script>
<script defer src="/static/ob/orderblock.js"></script>
</head>
<body>

<aside class="ob-side-rail" id="obSideRail" aria-label="Primary Navigation">
  <div class="rail-top">
    <a href="/app/orderblock" class="rail-logo" title="Order Block">
      <span class="logo-bars" aria-hidden="true">
        <i class="b1"></i>
        <i class="b2"></i>
        <i class="b3"></i>
      </span>
      <span class="rail-lbl rail-brand-lbl">Terminal</span>
    </a>
    <button type="button" class="rail-collapse" id="obRailToggle" title="Expand / Collapse sidebar" aria-label="Toggle sidebar">»</button>
    <div class="rail-divider"></div>
    <a href="/app/orderblock" class="rail-item active" title="Order Block Terminal (/app/orderblock)" data-tip="Order Block">
      <span class="rail-ic">⟁</span>
      <span class="rail-lbl">Order Block</span>
    </a>
  </div>
  <div class="rail-bottom">
    <div class="rail-live" title="Live 218 NSE F&amp;O Feed" data-tip="Live 218 F&O">
      <span class="rail-live-dot"></span>
      <span class="rail-lbl">218 Live</span>
    </div>
    <div class="rail-theme-pill" role="group" aria-label="Theme toggle">
      <button type="button" class="rt-btn" data-theme-set="light" title="Light theme" aria-label="Light theme" aria-pressed="false">☀</button>
      <button type="button" class="rt-btn" data-theme-set="dark" title="Dark theme" aria-label="Dark theme" aria-pressed="false">☾</button>
    </div>
    <a href="/app/settings" class="rail-item" id="obSettingsBtn" title="Settings · Upstox API &amp; Flow Rules (/app/settings)" data-tip="Settings">
      <span class="rail-ic" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="3"></circle>
          <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09a1.65 1.65 0 0 0-1-1.51 1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09a1.65 1.65 0 0 0 1.51-1 1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9c.26.6.77 1 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
        </svg>
      </span>
      <span class="rail-lbl">Settings</span>
    </a>
  </div>
</aside>

<header class="ob-top-bar" id="obTopBar">
  <div class="ob-bar-left">
    <div id="obFindHost"></div>
  </div>
  <div class="ob-bar-center">
    <div class="obc-pills" role="group" aria-label="Market side mode">
      <button type="button" class="obc-pill on" data-side="ALL" title="View all 218 F&O stocks">All <span class="obc-cnt" id="obCntAll">218</span></button>
      <button type="button" class="obc-pill" data-side="BULL" title="Full screen Bullish order blocks"><span class="obc-dot bull">●</span> Bullish <span class="obc-cnt" id="obCntBull">0</span></button>
      <button type="button" class="obc-pill" data-side="BEAR" title="Full screen Bearish order blocks"><span class="obc-dot bear">●</span> Bearish <span class="obc-cnt" id="obCntBear">0</span></button>
    </div>
  </div>
  <div class="ob-bar-right">
    <div class="obc-group">
      <span class="obc-lbl">SECTOR</span>
      <select id="obSecSel" aria-label="Sector filter">
        <option value="ALL">All Sectors (218)</option>
      </select>
    </div>
    <div class="obc-group">
      <span class="obc-lbl">SORT</span>
      <select id="obSortSel" aria-label="Sort order">
        <option value="MAX_GAINS">Max Gains (Bulls &amp; Bears)</option>
        <option value="SETUP_SCORE">Setup Score (Flow + OB)</option>
        <option value="FLOW_SCORE">Strongest Flow</option>
      </select>
    </div>
    <div class="ob-live-status">
      <span class="ob-live-dot">●</span>
      <span class="ob-live-txt" id="obLiveClock">LIVE</span>
    </div>
    <button type="button" id="obMotionBtn" class="ob-motion-btn" title="Pause or play ambient animations" aria-label="Pause ambient animations">Pause FX</button>
    <button type="button" id="obSyncBtn" class="ob-sync-btn" title="Refresh Live Data">↻</button>
  </div>
</header>

<div id="atmo" aria-hidden="true"></div>
<div id="stage" aria-label="OBF order-block flow dashboard">
  <div class="L" id="lyBase"></div>
  <div class="L" id="lyLight"></div>
  <div class="L" id="lyHalves"></div>
  <div class="L" id="lyVig"></div>
  <div id="topRail"></div>
  <div id="crest"></div>
  <div id="plumeWrap"></div>
  <div id="chips"></div>
  <div id="idxTags"></div>
  <div id="ladderWrap"></div>
  <div id="nodes"></div>
  <div id="tiles"></div>
  <div id="bridges"></div>
  <div id="tickets"></div>
  <div id="fxWrap"></div>
  <div id="inspector" role="status"></div>
</div>
<div id="stack"></div>
<div class="ob-toast-region" role="region" aria-label="Notifications">
  <div id="obActionToast" class="ob-toast" popover="manual">
    <span class="ob-toast-ico" aria-hidden="true">✓</span>
    <span class="ob-toast-body">
      <span class="ob-toast-msg"></span>
      <span class="ob-toast-sub"></span>
    </span>
    <button type="button" class="ob-toast-close" popovertarget="obActionToast" popovertargetaction="hide" aria-label="Dismiss notification">×</button>
  </div>
  <div id="obActionAnnounce" class="ob-sr" role="status" aria-live="polite" aria-atomic="true"></div>
</div>

</body>
</html>
